name: Canonical OpenChamber and OpenCode installer contract
on:
  push:
    branches: [upgrade/opencode-v2]
    paths:
      - install-openchamber.sh
      - install.sh
      - scripts/install-opencode-agents.sh
      - scripts/cleanup-openchamber-v1-before-v2.sh
      - tests/test_standard_installer.py
      - tests/test_agent_path_migration.sh
      - .github/workflows/installer-contract.yml
  pull_request:
    paths:
      - install-openchamber.sh
      - install.sh
      - scripts/install-opencode-agents.sh
      - scripts/cleanup-openchamber-v1-before-v2.sh
      - tests/test_standard_installer.py
      - tests/test_agent_path_migration.sh
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Validate canonical installer and config installer syntax
        run: |
          set -Eeuo pipefail
          bash -n install-openchamber.sh install.sh scripts/install-opencode-agents.sh scripts/cleanup-openchamber-v1-before-v2.sh tests/test_agent_path_migration.sh
          grep -Fq 'OPENCODE_INSTALL_VERSION="${OPENCODE_INSTALL_VERSION:-2.0.21}"' install.sh
          grep -Fq 'bash -s -- --version "$OPENCODE_INSTALL_VERSION"' install.sh
          git diff --check
      - name: Verify standard OpenCode agent path migration
        run: |
          set -Eeuo pipefail
          bash tests/test_agent_path_migration.sh
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          bash scripts/install-opencode-agents.sh config/opencode/agent "$tmp/agents"
          source_count=$(find config/opencode/agent -type f -name '*.md' | wc -l)
          installed_count=$(find "$tmp/agents" -type f -name '*.md' | wc -l)
          test "$source_count" -eq "$installed_count"
      - name: Verify thin OpenChamber/OpenCode v2 installer contract
        run: |
          set -Eeuo pipefail
          python3 tests/test_standard_installer.py
