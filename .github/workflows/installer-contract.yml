name: Canonical OpenChamber and OpenCode installer contract
on:
  push:
    branches: [integration/standard-bundle-installer-2026-09-19]
    paths:
      - install-openchamber.sh
      - tests/test_standard_installer.py
      - .github/workflows/installer-contract.yml
  pull_request:
    paths:
      - install-openchamber.sh
      - tests/test_standard_installer.py
permissions:
  contents: write
jobs:
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix literal grep option and remove dead code
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('install-openchamber.sh')
          s=p.read_text()
          before='grep -Fq "--host $HOST --port $PORT"'
          after='grep -Fq -- "--host $HOST --port $PORT"'
          if before in s:
            assert s.count(before)==1
            s=s.replace(before, after)
          assert after in s
          s=s.replace('for name in launcher opencode drop legacy-drop unit password state; do :; done\n','')
          p.write_text(s)
          PY
          bash -n install-openchamber.sh install.sh
          git diff --check
      - name: Test repeated standard installer downloads only manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo install -m 755 /bin/true /usr/local/bin/openchamber
          python3 tests/test_standard_installer.py
      - name: Persist contract correction only on integration branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- install-openchamber.sh; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install-openchamber.sh
          git commit -m 'fix(installer): match explicit host option literally; remove dead code'
          git push origin HEAD:refs/heads/integration/standard-bundle-installer-2026-09-19
