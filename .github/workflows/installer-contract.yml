name: Canonical OpenChamber and OpenCode installer contract
on:
  push:
    branches: [upgrade/opencode-v2]
    paths:
      - install-openchamber.sh
      - install.sh
      - scripts/install-opencode-generation.sh
      - scripts/install-openchamber-v2-core.sh
      - scripts/openchamber-runtime-store.sh
      - scripts/install-opencode-agents.sh
      - scripts/normalize-opencode-agent-permissions.mjs
      - scripts/cleanup-openchamber-v1-before-v2.sh
      - tests/test_standard_installer.py
      - tests/test_incremental_installer.sh
      - tests/test_binary_only_installer.sh
      - tests/test_openchamber_runtime_store.sh
      - tests/test_agent_path_migration.sh
      - tests/test_agent_permission_normalization.sh
      - .github/workflows/installer-contract.yml
  pull_request:
    paths:
      - install-openchamber.sh
      - install.sh
      - scripts/install-opencode-generation.sh
      - scripts/install-openchamber-v2-core.sh
      - scripts/openchamber-runtime-store.sh
      - scripts/install-opencode-agents.sh
      - scripts/normalize-opencode-agent-permissions.mjs
      - scripts/cleanup-openchamber-v1-before-v2.sh
      - tests/test_standard_installer.py
      - tests/test_incremental_installer.sh
      - tests/test_binary_only_installer.sh
      - tests/test_openchamber_runtime_store.sh
      - tests/test_agent_path_migration.sh
      - tests/test_agent_permission_normalization.sh
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Validate canonical installer and config installer syntax
        run: |
          set -Eeuo pipefail
          bash -n \
            install-openchamber.sh \
            install.sh \
            scripts/install-opencode-generation.sh \
            scripts/install-openchamber-v2-core.sh \
            scripts/openchamber-runtime-store.sh \
            scripts/install-opencode-agents.sh \
            scripts/cleanup-openchamber-v1-before-v2.sh \
            tests/test_incremental_installer.sh \
            tests/test_binary_only_installer.sh \
            tests/test_openchamber_runtime_store.sh \
            tests/test_agent_path_migration.sh \
            tests/test_agent_permission_normalization.sh
          node --check scripts/normalize-opencode-agent-permissions.mjs
          grep -Fq 'OPENCODE_INSTALL_VERSION="${OPENCODE_INSTALL_VERSION:-2.0.21}"' scripts/install-opencode-generation.sh
          grep -Fq 'bash -s -- --version "$OPENCODE_INSTALL_VERSION"' scripts/install-opencode-generation.sh
          git diff --check
      - name: Verify standard OpenCode agent path migration
        run: |
          set -Eeuo pipefail
          bash tests/test_agent_path_migration.sh
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          bash scripts/install-opencode-agents.sh config/opencode/agent "$tmp/agents"
          source_count=$(find config/opencode/agent -type f -name '*.md' | wc -l)
          installed_count=$(find "$tmp/agents" -type f -name '*.md' | wc -l)
          test "$source_count" -eq "$installed_count"
      - name: Verify managed agent permission normalization
        run: |
          set -Eeuo pipefail
          bash tests/test_agent_permission_normalization.sh
          node --test tests/trusted-paths.test.mjs tests/generation-state.test.mjs
      - name: Verify immutable OpenChamber runtime activation
        run: |
          set -Eeuo pipefail
          bash tests/test_openchamber_runtime_store.sh
      - name: Verify OpenCode binary-only bootstrap
        run: |
          set -Eeuo pipefail
          bash tests/test_binary_only_installer.sh
      - name: Verify incremental installer execution
        run: |
          set -Eeuo pipefail
          bash tests/test_incremental_installer.sh
      - name: Verify OpenChamber/OpenCode v2 installer contract
        run: |
          set -Eeuo pipefail
          python3 tests/test_standard_installer.py

