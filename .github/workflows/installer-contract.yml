name: Canonical OpenChamber and OpenCode installer contract
on:
  push:
    branches: [integration/standard-bundle-installer-2026-09-19]
    paths:
      - install-openchamber.sh
      - tests/test_standard_installer.py
      - .github/workflows/installer-contract.yml
  pull_request:
    paths:
      - install-openchamber.sh
      - tests/test_standard_installer.py
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Validate canonical installer and config installer syntax
        run: |
          set -Eeuo pipefail
          bash -n install-openchamber.sh install.sh
          git diff --check
      - name: Verify repeat install downloads only small manifest
        run: |
          set -Eeuo pipefail
          sudo install -m 755 /bin/true /usr/local/bin/openchamber
          python3 tests/test_standard_installer.py
