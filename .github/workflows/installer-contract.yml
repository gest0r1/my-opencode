name: Canonical OpenChamber and OpenCode installer contract
on:
  push:
    branches: [main]
    paths:
      - scripts/merge-user-plugins.mjs
      - config/opencode/plugin-policy.json
      - tests/test_user_plugins.mjs
      - install-openchamber.sh
      - install.sh
      - scripts/bootstrap-runtime-tools.sh
      - scripts/install-journal.sh
      - scripts/install-opencode-generation.sh
      - scripts/install-opencode-dependencies.sh
      - config/systemd/opencode-web.service
      - scripts/check-opencode-pins.mjs
      - config/opencode/package.json
      - config/opencode/bun.lock
      - tests/test_dependency_installer.sh
      - tests/test_deploy_sudo.sh
      - scripts/setup-opencode-deploy-sudo.sh
      - tests/test_generation_timeout.sh
      - scripts/install-openchamber-v2-core.sh
      - scripts/openchamber-runtime-store.sh
      - scripts/install-opencode-agents.sh
      - scripts/retire-opencode-agent-copies.mjs
      - scripts/normalize-opencode-agent-permissions.mjs
      - tests/test_standard_installer.py
      - tests/test_incremental_installer.sh
      - tests/test_install_journal.py
      - tests/test_runtime_toolchain.py
      - tests/test_node_runtime_floor.py
      - tests/test_install_ref_handover.sh
      - tests/test_install_ref_state_handover.sh
      - tests/test_install_rollback.sh
      - tests/test_binary_only_installer.sh
      - tests/test_native_activation.sh
      - tests/test_openchamber_runtime_store.sh
      - tests/test_agent_installation.sh
      - tests/test_agent_permission_normalization.sh
      - .github/workflows/installer-contract.yml
  pull_request:
    paths:
      - scripts/merge-user-plugins.mjs
      - config/opencode/plugin-policy.json
      - tests/test_user_plugins.mjs
      - install-openchamber.sh
      - install.sh
      - scripts/bootstrap-runtime-tools.sh
      - scripts/install-journal.sh
      - scripts/install-opencode-generation.sh
      - scripts/install-opencode-dependencies.sh
      - config/systemd/opencode-web.service
      - scripts/check-opencode-pins.mjs
      - config/opencode/package.json
      - config/opencode/bun.lock
      - tests/test_dependency_installer.sh
      - tests/test_deploy_sudo.sh
      - scripts/setup-opencode-deploy-sudo.sh
      - tests/test_generation_timeout.sh
      - scripts/install-openchamber-v2-core.sh
      - scripts/openchamber-runtime-store.sh
      - scripts/install-opencode-agents.sh
      - scripts/retire-opencode-agent-copies.mjs
      - scripts/normalize-opencode-agent-permissions.mjs
      - tests/test_standard_installer.py
      - tests/test_incremental_installer.sh
      - tests/test_install_journal.py
      - tests/test_runtime_toolchain.py
      - tests/test_node_runtime_floor.py
      - tests/test_install_ref_handover.sh
      - tests/test_install_ref_state_handover.sh
      - tests/test_install_rollback.sh
      - tests/test_binary_only_installer.sh
      - tests/test_native_activation.sh
      - tests/test_openchamber_runtime_store.sh
      - tests/test_agent_installation.sh
      - tests/test_agent_permission_normalization.sh
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Validate canonical installer and config installer syntax
        run: |
          set -Eeuo pipefail
          for file in \
            install-openchamber.sh \
            install.sh \
            scripts/install-opencode-generation.sh \
            scripts/install-opencode-dependencies.sh \
            scripts/install-openchamber-v2-core.sh \
            scripts/install-openchamber-unified.sh \
            scripts/stage-openchamber-unified-release.sh \
            scripts/openchamber-runtime-store.sh \
            scripts/install-opencode-agents.sh \
            tests/test_incremental_installer.sh \
            tests/test_binary_only_installer.sh \
            tests/test_openchamber_runtime_store.sh \
            tests/test_agent_installation.sh \
            tests/test_agent_permission_normalization.sh; do
            bash -n "$file"
          done
          node --check scripts/normalize-opencode-agent-permissions.mjs
          node --check scripts/preserve-agent-colors.mjs
          node --check scripts/merge-user-plugins.mjs
          bash tests/test_security_history_guards.sh
          node scripts/check-opencode-pins.mjs
          grep -Fq 'bash -s -- --version "$OPENCODE_INSTALL_VERSION"' scripts/install-opencode-generation.sh
          git diff --check
      - name: Verify canonical OpenCode agent installation
        run: |
          set -Eeuo pipefail
          bash tests/test_agent_installation.sh
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          bash scripts/install-opencode-agents.sh config/opencode/agent "$tmp/agents"
          source_count=$(find config/opencode/agent -type f -name '*.md' | wc -l)
          installed_count=$(find "$tmp/agents" -type f -name '*.md' | wc -l)
          test "$source_count" -eq "$installed_count"
      - name: Verify managed agent permission normalization
        run: |
          set -Eeuo pipefail
          bash tests/test_agent_permission_normalization.sh
          node --test tests/trusted-paths.test.mjs tests/generation-state.test.mjs tests/test_user_plugins.mjs
      - name: Verify immutable OpenChamber runtime activation
        run: |
          set -Eeuo pipefail
          bash tests/test_openchamber_runtime_store.sh
          bash tests/test_native_activation.sh
      - name: Verify full configuration bootstrap and dependency timeout
        run: |
          set -Eeuo pipefail
          bash tests/test_binary_only_installer.sh
          bash tests/test_dependency_installer.sh
          sudo bash tests/test_deploy_sudo.sh
          bash tests/test_generation_timeout.sh
      - name: Verify incremental installer execution and audit handover
        run: |
          set -Eeuo pipefail
          bash tests/test_incremental_installer.sh
          bash tests/test_install_ref_handover.sh
          bash tests/test_install_ref_state_handover.sh
          bash tests/test_install_rollback.sh
          python3 tests/test_install_journal.py
          python3 tests/test_node_runtime_floor.py
          python3 tests/test_runtime_toolchain.py
      - name: Verify OpenChamber/OpenCode v2 installer contract
        run: |
          set -Eeuo pipefail
          python3 tests/test_standard_installer.py

