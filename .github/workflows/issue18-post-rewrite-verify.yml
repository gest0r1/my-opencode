name: Issue 18 fresh remote history verification (read-only)
on:
  push:
    branches:
      - security/issue18-history-cleanup-phase2
    paths:
      - .github/workflows/issue18-post-rewrite-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify all freshly fetched writable refs are clean
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --tags origin
          python3 scripts/scan-history-candidates.py | tee "$RUNNER_TEMP/issue18-heads.log"
          for field in exchange_header itop_token gdrive_client_secret gdrive_refresh_token gdrive_client_id; do
            grep -qx "HISTORY_AUDIT candidate_blobs_${field}=0" "$RUNNER_TEMP/issue18-heads.log"
          done
          echo "ISSUE18_REMOTE_VERIFIED writable_refs=PASS known_secret_classes=0"
      - name: Inspect historic PR refs (GitHub-owned, non-writable)
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin '+refs/pull/*/head:refs/audit/pull-head/*'
          echo "ISSUE18_PR_REFS_CHECK count=$(git for-each-ref --format='%(refname)' refs/audit/pull-head | wc -l)"
          python3 scripts/scan-history-candidates.py
