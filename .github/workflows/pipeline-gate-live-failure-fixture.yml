name: Pipeline gate live failure fixture

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Expected ref SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  pipeline_ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify dispatch ref identity
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$EXPECTED_SHA" = "$GITHUB_SHA"

      - name: Intentional fixture failure
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'TOKEN=fixture-secret-value\n'
          printf 'intentional live negative fixture failure\n'
          exit 17
