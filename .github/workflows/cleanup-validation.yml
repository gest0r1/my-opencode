name: cleanup-validation

on:
  push:
    branches:
      - cleanup/upstream-aligned-2026-09-11
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python3 -m json.tool config/opencode/opencode.json >/dev/null
          python3 -m json.tool config/opencode/package.json >/dev/null
      - name: Validate shell syntax
        run: |
          bash -n install.sh
          bash -n install-openchamber.sh
          bash -n config/opencode/skills/task-management/router.sh
      - name: Check active config for retired runtime references
        run: |
          set -e
          ! grep -R --line-number --exclude-dir=.git -E 'plugins/shell-strategy|~/.opencode/agent|StageOrchestrator' config/opencode/agent config/opencode/opencode.json install.sh config/opencode/command || false
          if grep -R --line-number --exclude-dir=.git -E 'plugins/shell-strategy|~/.opencode/agent|StageOrchestrator' config/opencode/agent config/opencode/opencode.json install.sh config/opencode/command; then
            echo 'Found retired runtime reference' >&2
            exit 1
          fi
      - name: Check active config for literal integration secrets
        run: |
          python3 - <<'PY'
          import json,re,sys
          p='config/opencode/opencode.json'
          s=open(p,encoding='utf-8').read()
          required=['{env:EXCHANGE_MCP_API_KEY}','{env:ITOP_TOKEN}','{env:GDRIVE_MCP_CLIENT_ID}','{env:GDRIVE_MCP_CLIENT_SECRET}','{env:GDRIVE_MCP_REFRESH_TOKEN}']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing env secret refs: '+', '.join(missing))
          PY
      - name: Run task-management tests
        run: node --test config/opencode/skills/task-management/scripts/github-handoff-core.test.mjs
