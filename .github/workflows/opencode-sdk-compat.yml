name: OpenCode pin and OpenChamber 2.8 SDK compatibility

on:
  pull_request:
    paths:
      - config/opencode/package.json
      - config/opencode/bun.lock
      - install.sh
      - scripts/install-opencode-generation.sh
      - scripts/install-openchamber-v2-core.sh
      - scripts/check-opencode-pins.mjs
      - .github/workflows/opencode-sdk-compat.yml
  push:
    branches: [main]
    paths:
      - config/opencode/package.json
      - config/opencode/bun.lock
      - install.sh
      - scripts/install-opencode-generation.sh
      - scripts/install-openchamber-v2-core.sh
      - scripts/check-opencode-pins.mjs
      - .github/workflows/opencode-sdk-compat.yml

permissions:
  contents: read

jobs:
  sdk-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Verify pinned version and official installer syntax
        run: |
          set -Eeuo pipefail
          node scripts/check-opencode-pins.mjs
          bash -n install.sh
          bash -n scripts/install-opencode-generation.sh
          bash -n scripts/install-openchamber-v2-core.sh
      - name: Install lockfile with no resolver drift
        working-directory: config/opencode
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify installed SDK matches OpenChamber 2.8.0 dependency line
        working-directory: config/opencode
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          for (const name of ['ai','client','plugin','protocol','schema','util']) {
            const pkg = JSON.parse(fs.readFileSync('node_modules/@opencode/' + name + '/package.json', 'utf8'));
            assert.equal(pkg.version, '2.3.2', name + ' SDK must match OpenChamber 2.8.0');
          }
          console.log('PASS: all six OpenCode SDK packages pinned to v2.3.2');
          NODE
          bun -e "import('@opencode/client').then(m => { if (typeof m.OpenCode?.make !== 'function') throw Error('OpenCode client API unavailable'); console.log('PASS: SDK client import') })"
