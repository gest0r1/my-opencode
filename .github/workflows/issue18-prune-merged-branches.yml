name: Issue 18 prune fully merged branches (lease guarded)
on:
  push:
    branches:
      - security/issue18-history-cleanup-phase2
    paths:
      - scripts/issue18-prune-merged-branches.sh
      - .github/workflows/issue18-prune-merged-branches.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: issue18-prune-merged-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      # Switch to "yes" only after inspecting dry-run.
      ISSUE18_PRUNE_APPLY: yes
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Check exact merged and approved-squash branch refs
        run: bash scripts/issue18-prune-merged-branches.sh
