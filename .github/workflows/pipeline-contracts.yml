name: Pipeline contracts

on:
  pull_request:
    paths:
      - 'config/opencode/agent/**'
      - 'config/opencode/opencode.json'
      - 'config/opencode/package.json'
      - 'config/opencode/bun.lock'
      - 'config/opencode/plugin-policy.json'
      - 'config/systemd/**'
      - 'config/opencode/plugins/**'
      - 'config/opencode.env.example'
      - 'config/opencode/skills/**'
      - 'config/opencode/command/pipeline-*.md'
      - 'config/opencode/config/agent-metadata.json'
      - 'config/opencode/skills/task-management/**'
      - 'install.sh'
      - 'scripts/**'
      - 'tests/**'
      - 'install*.sh'
      - '.github/workflows/pipeline-*.yml'
  push:
    branches:
      - main
    paths:
      - 'config/opencode/agent/**'
      - 'config/opencode/opencode.json'
      - 'config/opencode/package.json'
      - 'config/opencode/bun.lock'
      - 'config/opencode/plugin-policy.json'
      - 'config/systemd/**'
      - 'config/opencode/plugins/**'
      - 'config/opencode.env.example'
      - 'config/opencode/skills/**'
      - 'config/opencode/command/pipeline-*.md'
      - 'config/opencode/config/agent-metadata.json'
      - 'config/opencode/skills/task-management/**'
      - 'scripts/**'
      - 'tests/**'
      - 'install*.sh'
      - '.github/workflows/pipeline-*.yml'

concurrency:
  group: pipeline-contracts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Git identity for repository fixtures
        run: |
          git config --global user.name 'Pipeline Contract CI'
          git config --global user.email 'pipeline-contract-ci@example.invalid'

      - name: Verify OpenCode pins
        run: node scripts/check-opencode-pins.mjs

      - name: Install pinned V2 runtime for behavioral tests
        run: npm install --prefix config/opencode --ignore-scripts --no-package-lock --no-save tsx@4.23.15

      - name: Run pipeline contract tests
        env:
          NODE_NO_WARNINGS: '1'
          PIPELINE_REAL_DOCKER: '1'
        run: |
          node --test \
            config/opencode/skills/task-management/scripts/config-security.test.mjs \
            config/opencode/skills/task-management/scripts/agent-models.test.mjs \
            config/opencode/skills/task-management/scripts/opencode-v2-runtime-contract.test.mjs \
            config/opencode/skills/task-management/scripts/manifest-preflight.test.mjs \
            config/opencode/skills/task-management/scripts/capability-preflight.test.mjs \
            config/opencode/skills/task-management/scripts/github-actions-pr.test.mjs \
            config/opencode/skills/task-management/scripts/pipeline-v2-contract.test.mjs \
            config/opencode/skills/task-management/scripts/stage-cli-rules.test.mjs \
            config/opencode/skills/task-management/scripts/stage-cli-scope.test.mjs \
            config/opencode/skills/task-management/scripts/stage-cli-budget.test.mjs \
            config/opencode/skills/task-management/scripts/stage-cli-dag.test.mjs \
            config/opencode/skills/task-management/scripts/stage-lock-cli.test.mjs \
            config/opencode/skills/task-management/scripts/stage-complete-cli.test.mjs \
            config/opencode/skills/task-management/scripts/runtime-diagnostic-cli.test.mjs \
            config/opencode/skills/task-management/scripts/owner-amendment-boundary.test.mjs \
            config/opencode/skills/task-management/scripts/owner-amendment-policy.test.mjs \
            config/opencode/skills/task-management/scripts/owner-amendment-git-gate.test.mjs \
            config/opencode/skills/task-management/scripts/gate-runner-cli.test.mjs \
            config/opencode/skills/task-management/scripts/gate-testing-policy.test.mjs \
            config/opencode/skills/task-management/scripts/git-worktree-cli.test.mjs \
            config/opencode/skills/task-management/scripts/worktree-refresh.test.mjs \
            config/opencode/skills/task-management/scripts/pipeline-refresh-cli.test.mjs \
            config/opencode/skills/task-management/scripts/github-handoff-core.test.mjs \
            config/opencode/skills/task-management/scripts/github-actions-gate-cli.test.mjs \
            config/opencode/skills/task-management/scripts/github-actions-gate-runtime.test.mjs \
            config/opencode/skills/task-management/scripts/github-actions-hardening.test.mjs \
            config/opencode/skills/task-management/scripts/deployment-target-cli.test.mjs \
            config/opencode/skills/task-management/scripts/github-issue-cli.test.mjs \
            config/opencode/skills/task-management/scripts/github-pr-cli.test.mjs \
            config/opencode/skills/task-management/scripts/pipeline-github-sync.test.mjs \
            config/opencode/skills/task-management/scripts/pipeline-agent-audit.test.mjs \
            config/opencode/skills/task-management/scripts/pipeline-command-paths.test.mjs \
            config/opencode/skills/task-management/scripts/pipeline-tmp-permissions.test.mjs \
            config/opencode/skills/task-management/scripts/early-advisory-contract.test.mjs \
            config/opencode/skills/task-management/scripts/pipeline-runtime.test.mjs \
            config/opencode/skills/task-management/scripts/reuse-report.test.mjs

      - name: Verify permanent installer contracts
        run: |
          python3 tests/test_standard_installer.py
          python3 tests/test_runtime_user_install_contract.py
          python3 tests/test_runtime_processes.py
          bash tests/test_agent_installation.sh
          bash tests/test_binary_only_installer.sh
          bash tests/test_incremental_installer.sh
          bash tests/test_native_activation.sh
          bash tests/test_openchamber_runtime_store.sh
          bash tests/test_dependency_installer.sh
          bash tests/test_generation_timeout.sh
          node --test tests/test_user_plugins.mjs tests/generation-state.test.mjs tests/trusted-paths.test.mjs
