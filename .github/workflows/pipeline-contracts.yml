name: Pipeline contracts

on:
  pull_request:
    paths:
      - 'config/opencode/agent/**'
      - 'config/opencode/opencode.json'
      - 'config/opencode.env.example'
      - 'config/opencode/skills/**'
      - 'config/opencode/command/pipeline-*.md'
      - 'config/opencode/config/agent-metadata.json'
      - 'config/opencode/skills/task-management/**'
      - 'install.sh'
      - '.github/workflows/pipeline-contracts.yml'
  push:
    branches:
      - main
      - 'audit/**'
    paths:
      - 'config/opencode/agent/**'
      - 'config/opencode/opencode.json'
      - 'config/opencode.env.example'
      - 'config/opencode/skills/**'
      - 'config/opencode/command/pipeline-*.md'
      - 'config/opencode/config/agent-metadata.json'
      - 'config/opencode/skills/task-management/**'
      - '.github/workflows/pipeline-contracts.yml'

concurrency:
  group: pipeline-contracts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Git identity for repository fixtures
        run: |
          git config --global user.name 'Pipeline Contract CI'
          git config --global user.email 'pipeline-contract-ci@example.invalid'

      - name: Run pipeline contract tests
        env:
          NODE_NO_WARNINGS: '1'
        run: |
          node --test \
            config/opencode/skills/task-management/scripts/config-security.test.mjs \
            config/opencode/skills/task-management/scripts/agent-models.test.mjs \
            config/opencode/skills/task-management/scripts/manifest-preflight.test.mjs \
            config/opencode/skills/task-management/scripts/pipeline-v2-contract.test.mjs \
            config/opencode/skills/task-management/scripts/stage-cli-rules.test.mjs \
            config/opencode/skills/task-management/scripts/stage-cli-dag.test.mjs \
            config/opencode/skills/task-management/scripts/gate-runner-cli.test.mjs \
            config/opencode/skills/task-management/scripts/git-worktree-cli.test.mjs \
            config/opencode/skills/task-management/scripts/worktree-refresh.test.mjs \
            config/opencode/skills/task-management/scripts/github-handoff-core.test.mjs \
            config/opencode/skills/task-management/scripts/github-actions-gate-cli.test.mjs \
            config/opencode/skills/task-management/scripts/github-issue-cli.test.mjs \
            config/opencode/skills/task-management/scripts/github-pr-cli.test.mjs \
            config/opencode/skills/task-management/scripts/pipeline-github-sync.test.mjs \
            config/opencode/skills/task-management/scripts/pipeline-agent-audit.test.mjs


  live-github-gate:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/pipeline-github-ci-gates'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPOSITORY: ${{ github.repository }}
      TARGET_BRANCH: ${{ github.head_ref }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      LIVE_RUN_ID: live-github-gate
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Prepare frozen live-gate fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/live-gate"
          STATE_ROOT="$RUNNER_TEMP/live-gate-state"
          RUN_ROOT="$ROOT/$LIVE_RUN_ID"
          mkdir -p "$RUN_ROOT" "$STATE_ROOT/$LIVE_RUN_ID"

          node - "$RUN_ROOT" "$STATE_ROOT" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const [runRoot, stateRoot] = process.argv.slice(2);
          const runId = process.env.LIVE_RUN_ID;
          const manifestFile = path.join(runRoot, 'manifest.json');
          const manifest = {
            schema_version: 2,
            run_id: runId,
            repository: process.env.TARGET_REPOSITORY,
            git_setup: {
              base_sha: '0000000000000000000000000000000000000000',
              branch: process.env.TARGET_BRANCH,
            },
            pipelines: [{
              id: 'app',
              stages: ['tests'],
              executors: { tests: 'github_ci' },
              github_gates: {
                tests: {
                  workflow: '.github/workflows/pipeline-gate-live-fixture.yml',
                  terminal_job: 'pipeline_ci',
                  trigger: 'push',
                  artifact: 'candidate-build',
                  timeout_seconds: 480,
                },
              },
            }],
          };
          fs.writeFileSync(manifestFile, JSON.stringify(manifest, null, 2) + '\n');
          fs.writeFileSync(path.join(runRoot, 'candidate.json'), JSON.stringify({
            status: 'PASS',
            run_id: runId,
            branch: process.env.TARGET_BRANCH,
            candidate_sha: process.env.TARGET_SHA,
            remote_sha: process.env.TARGET_SHA,
          }, null, 2) + '\n');
          fs.writeFileSync(path.join(stateRoot, runId, 'state.json'), JSON.stringify({
            run_id: runId,
            manifest_file: manifestFile,
          }, null, 2) + '\n');
          NODE

          echo "LIVE_RUN_ROOT=$RUN_ROOT" >> "$GITHUB_ENV"
          echo "LIVE_STATE_ROOT=$STATE_ROOT" >> "$GITHUB_ENV"

      - name: Validate live target workflow contract
        run: >
          npx --yes tsx
          config/opencode/skills/task-management/scripts/github-actions-gate-cli.ts
          validate "$LIVE_RUN_ID" app tests --state-root "$LIVE_STATE_ROOT"

      - name: Verify exact-SHA GitHub run and artifact
        run: >
          npx --yes tsx
          config/opencode/skills/task-management/scripts/github-actions-gate-cli.ts
          run "$LIVE_RUN_ID" app tests --state-root "$LIVE_STATE_ROOT"

      - name: Assert live evidence identity
        shell: bash
        run: |
          set -Eeuo pipefail
          node - "$LIVE_RUN_ROOT/github/app-tests.json" <<'NODE'
          const fs = require('fs');
          const evidence = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (evidence.status !== 'PASS') throw new Error('live gate evidence is not PASS');
          if (evidence.candidate_sha !== process.env.TARGET_SHA) throw new Error('candidate SHA mismatch');
          if (evidence.head_sha !== process.env.TARGET_SHA) throw new Error('workflow head SHA mismatch');
          if (evidence.workflow !== '.github/workflows/pipeline-gate-live-fixture.yml') throw new Error('workflow mismatch');
          if (evidence.terminal_job !== 'pipeline_ci') throw new Error('terminal job mismatch');
          if (evidence.artifact !== 'candidate-build') throw new Error('artifact mismatch');
          if (!Number.isInteger(Number(evidence.workflow_run_id))) throw new Error('workflow run id missing');
          NODE
