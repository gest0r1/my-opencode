name: Pipeline gate live fixture

on:
  push:
    branches:
      - feat/pipeline-github-ci-gates

permissions:
  contents: read

jobs:
  pipeline_ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' "$GITHUB_SHA" > candidate-sha.txt
