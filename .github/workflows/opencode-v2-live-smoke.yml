name: OpenCode V2 live smoke

on:
  push:
    branches:
      - 'upgrade/opencode-v2'
    paths:
      - 'install.sh'
      - 'scripts/install-opencode-agents.sh'
      - 'scripts/normalize-opencode-agent-permissions.mjs'
      - 'scripts/materialize-opencode-trusted-paths.mjs'
      - 'scripts/install-opencode-generation.sh'
      - 'scripts/install-opencode-dependencies.sh'
      - 'config/opencode/**'
      - '.github/workflows/opencode-v2-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-v2-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OpenCode 2.0.21 with this branch config
        env:
          OPENCODE_CONFIG_REF: ${{ github.sha }}
          OPENCODE_INSTALL_VERSION: 2.0.21
        run: |
          set -Eeuo pipefail
          bash install.sh

      - name: Validate real V2 config, agents and permissions
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.opencode/bin:$HOME/.bun/bin:$PATH"
          version="$(opencode --version | sed -E 's/^opencode[[:space:]]+v?//; s/^v//')"
          test "$version" = "2.0.21"

          timeout 45s opencode debug config > /tmp/opencode-config.json 2> /tmp/opencode-config.err
          test -s /tmp/opencode-config.json

          # PluginSupervisor activates post-config plugins asynchronously. Poll
          # the same daemon until ConfigAgentPlugin has populated the registry.
          activated=0
          for attempt in {1..30}; do
            timeout 15s opencode debug agents > /tmp/opencode-agents.txt 2> /tmp/opencode-agents.err || true
            if node -e '
              const fs=require("fs");
              try {
                const a=JSON.parse(fs.readFileSync("/tmp/opencode-agents.txt","utf8"));
                process.exit(a.some(x => (x.id ?? x.name) === "OpenStageOrchestrator") ? 0 : 1);
              } catch { process.exit(1) }
            '; then
              activated=1
              break
            fi
            sleep 0.25
          done
          if [[ "$activated" != 1 ]]; then
            echo "ConfigAgentPlugin did not expose managed agents after bounded wait." >&2
            cat /tmp/opencode-agents.err >&2 || true
            cat /tmp/opencode-agents.txt >&2 || true
            exit 1
          fi

          if grep -Fq 'Failed to load plugin' /tmp/opencode-config.err /tmp/opencode-agents.err; then
            cat /tmp/opencode-config.err /tmp/opencode-agents.err >&2
            exit 1
          fi
          test -f "$HOME/.config/opencode/plugins/pipeline-runtime.ts"
          test -f "$HOME/.config/opencode/AGENTS.md"
          grep -Fq '# Shell Non-Interactive Strategy (Global)' "$HOME/.config/opencode/AGENTS.md"
          test ! -e "$HOME/.config/opencode/context/shell-strategy"
          test ! -e "$HOME/.config/opencode/plugins/shell-strategy"
          ! grep -Fq '@franlol/opencode-md-table-formatter' "$HOME/.config/opencode/opencode.json"
          (
            cd "$HOME/.config/opencode"
            bun -e '
              const mod = await import("./plugins/pipeline-runtime.ts");
              if (!mod.default || typeof mod.default.id !== "string" || typeof mod.default.setup !== "function") {
                throw new Error("pipeline-runtime local plugin failed V2 import contract");
              }
            '
          )

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const os = require('os');
          const config = JSON.parse(fs.readFileSync('/tmp/opencode-config.json', 'utf8'));
          const agents = JSON.parse(fs.readFileSync('/tmp/opencode-agents.txt', 'utf8'));
          const idOf = (agent) => agent.id ?? agent.name;
          const byID = new Map(agents.map((agent) => [idOf(agent), agent]));
          console.error('Resolved agent catalog:', agents.map((agent) => `${idOf(agent)}:${agent.mode}`).join(', '));

          const serialized = JSON.stringify(config);
          for (const forbidden of ['/tmp/openchamber-v2-install', '/home/guber/', '.opencode/skills/']) {
            if (serialized.includes(forbidden)) throw new Error(`stale/host-specific config path: ${forbidden}`);
          }
          for (const required of ['context7', 'gh_grep', '1c-buddy']) {
            if (!serialized.includes(required)) throw new Error(`missing configured MCP: ${required}`);
          }
          for (const retired of ['yonote', 'exchange', 'bitrix24', 'n8n', 'itop', 'google-drive', 'image-gen']) {
            if (serialized.includes(`"${retired}"`)) throw new Error(`retired MCP still active: ${retired}`);
          }

          // Every managed file is flat and its exact basename is its OpenCode ID.
          const root = path.join(os.homedir(), '.config', 'opencode', 'agents');
          const files = fs.readdirSync(root).filter((name) => name.endsWith('.md')).sort();
          if (files.length < 30) throw new Error(`managed agent set unexpectedly small: ${files.length}`);
          for (const file of files) {
            const id = file.slice(0, -3);
            const text = fs.readFileSync(path.join(root, file), 'utf8');
            const expectedMode = /^mode:\s*(\S+)\s*$/m.exec(text)?.[1];
            const resolved = byID.get(id);
            if (!resolved) throw new Error(`managed agent missing from live registry: ${id}`);
            if (expectedMode && resolved.mode !== expectedMode) {
              throw new Error(`${id}: expected mode=${expectedMode}, live mode=${resolved.mode}`);
            }
          }

          const wildcard = (value, pattern) => {
            const escaped = pattern.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.');
            return new RegExp(`^${escaped}$`).test(value);
          };
          const evaluate = (rules, action, resource) => {
            for (let i = rules.length - 1; i >= 0; i--) {
              const rule = rules[i];
              if (wildcard(action, rule.action) && wildcard(resource, rule.resource)) return rule.effect;
            }
            return 'ask';
          };
          const sampleFromPattern = (pattern) => pattern.replace(/\*\*/g, 'fixture/path').replace(/\*/g, 'fixture').replace(/\?/g, 'x');

          const errors = [];
          const legacyActions = new Set(['task', 'bash', 'write', 'patch']);
          for (const agent of agents) {
            const id = idOf(agent);
            const rules = agent.permissions ?? [];
            for (const rule of rules) {
              if (legacyActions.has(rule.action)) {
                errors.push(`${id}: legacy runtime permission action '${rule.action}' was not normalized`);
              }

              // Every exact allow, regardless of action, must still be effective
              // after last-match-wins resolution. Globs are checked by dedicated
              // policy assertions because a glob is not a concrete resource.
              if (rule.effect === 'allow' && rule.resource !== '*' && !/[*?]/.test(rule.resource)) {
                const effective = evaluate(rules, rule.action, rule.resource);
                if (effective !== 'allow') {
                  errors.push(`${id}: ${rule.action} allow for '${rule.resource}' is shadowed; effective=${effective}`);
                }
              }

              if (rule.effect === 'allow') {
                if (rule.resource.includes('/root/.config/opencode/skills/') && os.homedir() !== '/root') {
                  errors.push(`${id}: permission still trusts root-specific managed skill path '${rule.resource}'`);
                }
                if (/(^|\s)\.opencode\/skills\/(task-management|context7)\//.test(rule.resource)) {
                  errors.push(`${id}: permission still trusts repository-local managed skill path '${rule.resource}'`);
                }
              }

              if (rule.action !== 'subagent' || rule.effect !== 'allow') continue;
              if (rule.resource === '*' || /[*?]/.test(rule.resource)) continue;
              const target = byID.get(rule.resource);
              if (!target) {
                errors.push(`${id}: allow targets unknown subagent '${rule.resource}'`);
                continue;
              }
              if (target.mode === 'primary') {
                errors.push(`${id}: allow targets primary agent '${rule.resource}'`);
              }
            }
          }

          const expectEffect = (id, action, resource, expected, label = `${action} ${resource}`) => {
            const agent = byID.get(id);
            if (!agent) {
              errors.push(`${id}: missing while checking ${label}`);
              return;
            }
            const actual = evaluate(agent.permissions ?? [], action, resource);
            if (actual !== expected) errors.push(`${id}: ${label} expected=${expected} actual=${actual}`);
          };
          const expectCanonicalAllow = (id, action, contains, label) => {
            const agent = byID.get(id);
            if (!agent) {
              errors.push(`${id}: missing while checking ${label}`);
              return;
            }
            const rule = (agent.permissions ?? []).find((candidate) =>
              candidate.action === action && candidate.effect === 'allow' && candidate.resource.includes(contains));
            if (!rule) {
              errors.push(`${id}: no canonical allow found for ${label}`);
              return;
            }
            if (!rule.resource.includes('.config/opencode/skills/')) {
              errors.push(`${id}: ${label} is not under global config: ${rule.resource}`);
            }
            if ((rule.resource.includes('/root/.config/opencode/skills/') && os.homedir() !== '/root') || /(^|\s)\.opencode\/skills\//.test(rule.resource)) {
              errors.push(`${id}: ${label} uses unsafe path: ${rule.resource}`);
            }
            const sample = sampleFromPattern(rule.resource);
            const actual = evaluate(agent.permissions ?? [], action, sample);
            if (actual !== 'allow') errors.push(`${id}: ${label} canonical rule is ineffective for '${sample}': ${actual}`);
          };

          // Orchestrator: scratch-only edits, exact worker delegation and only
          // installer-owned pipeline CLI execution.
          expectEffect('OpenStageOrchestrator', 'edit', 'packages/example.ts', 'deny', 'broad edit');
          expectEffect('OpenStageOrchestrator', 'edit', '.tmp/pipelines/example.md', 'allow', 'pipeline scratch edit');
          for (const target of ['ContextScout', 'CoderAgent', 'CodeReviewer', 'TestEngineer']) {
            expectEffect('OpenStageOrchestrator', 'subagent', target, 'allow', `delegate ${target}`);
          }
          expectEffect('OpenStageOrchestrator', 'subagent', 'build', 'deny', 'delegate primary build');
          expectCanonicalAllow('OpenStageOrchestrator', 'shell', 'task-management/scripts/stage-cli.ts', 'stage-cli');
          expectEffect(
            'OpenStageOrchestrator',
            'shell',
            'npx tsx .opencode/skills/task-management/scripts/stage-cli.ts validate fixture',
            'deny',
            'repository-local stage-cli',
          );
          expectEffect(
            'OpenStageOrchestrator',
            'shell',
            'npx tsx /root/.config/opencode/skills/task-management/scripts/stage-cli.ts validate fixture',
            os.homedir() === '/root' ? 'allow' : 'deny',
            'foreign-home stage-cli',
          );

          for (const home of [os.homedir(), '$HOME', '${HOME}']) {
            expectEffect('OpenStageOrchestrator', 'shell', `npx tsx ${home}/.config/opencode/skills/task-management/scripts/stage-cli.ts validate fixture`, 'allow', 'equivalent trusted CLI spelling');
          }

          // Implementation worker: source edits are allowed, secrets/git are not,
          // delegation is discovery-only, arbitrary shell stays closed.
          expectEffect('CoderAgent', 'edit', 'src/example.ts', 'allow');
          expectEffect('CoderAgent', 'edit', '.env', 'deny');
          expectEffect('CoderAgent', 'edit', '.git/config', 'deny');
          expectEffect('CoderAgent', 'subagent', 'ContextScout', 'allow');
          expectEffect('CoderAgent', 'subagent', 'ExternalScout', 'allow');
          expectEffect('CoderAgent', 'subagent', 'TestEngineer', 'deny');
          expectEffect('CoderAgent', 'shell', 'npm test', 'deny');
          expectCanonicalAllow('CoderAgent', 'shell', 'task-management/router.sh', 'task router');

          // Build worker is diagnostic only: build/typecheck yes, package mutation
          // and arbitrary pnpm exec no, source edits never.
          expectEffect('BuildAgent', 'shell', 'pnpm run build', 'allow');
          expectEffect('BuildAgent', 'shell', 'pnpm run typecheck', 'allow');
          expectEffect('BuildAgent', 'shell', 'pnpm install', 'deny');
          expectEffect('BuildAgent', 'shell', 'pnpm publish', 'deny');
          expectEffect('BuildAgent', 'shell', 'pnpm exec sh', 'deny');
          expectEffect('BuildAgent', 'edit', 'src/example.ts', 'deny');

          // Reviewer may emit evidence only to pipeline scratch and cannot run
          // shell or edit source.
          expectEffect('CodeReviewer', 'shell', 'npm test', 'deny');
          expectEffect('CodeReviewer', 'edit', 'src/example.ts', 'deny');
          expectEffect('CodeReviewer', 'edit', '.tmp/pipelines/review.json', 'allow');

          // Local discovery is strictly read-only and cannot reach the network.
          expectEffect('ContextScout', 'read', 'src/example.ts', 'allow');
          expectEffect('ContextScout', 'edit', 'src/example.ts', 'deny');
          expectEffect('ContextScout', 'shell', 'ls', 'deny');
          expectEffect('ContextScout', 'subagent', 'CoderAgent', 'deny');
          expectEffect('ContextScout', 'webfetch', 'https://example.com', 'deny');

          // External docs scout can persist bounded evidence and read only the
          // trusted global Context7 skill, never a repository-controlled copy.
          expectEffect('ExternalScout', 'webfetch', 'https://example.com', 'allow');
          expectEffect('ExternalScout', 'shell', 'curl https://example.com', 'deny');
          expectEffect('ExternalScout', 'subagent', 'ContextScout', 'deny');
          expectEffect('ExternalScout', 'edit', '.tmp/external-context/evidence.md', 'allow');
          expectCanonicalAllow('ExternalScout', 'read', 'skills/context7/', 'Context7 read');
          expectCanonicalAllow('ExternalScout', 'external_directory', 'skills/context7/', 'Context7 external directory');
          expectEffect('ExternalScout', 'read', '.opencode/skills/context7/README.md', 'deny', 'repository-local Context7 read');

          // Internet researcher is intentionally stateless with respect to the
          // repository: no local reads/writes/shell/delegation.
          expectEffect('WebResearcher', 'webfetch', 'https://example.com', 'allow');
          expectEffect('WebResearcher', 'read', 'README.md', 'deny');
          expectEffect('WebResearcher', 'edit', '.tmp/research.md', 'deny');
          expectEffect('WebResearcher', 'shell', 'echo test', 'deny');
          expectEffect('WebResearcher', 'subagent', 'ContextScout', 'deny');

          // DevOps may diagnose but never mutate infrastructure directly.
          expectEffect('OpenDevopsSpecialist', 'shell', 'docker ps -a', 'allow');
          expectEffect('OpenDevopsSpecialist', 'shell', 'kubectl get pods', 'allow');
          expectEffect('OpenDevopsSpecialist', 'shell', 'terraform plan -no-color', 'allow');
          expectEffect('OpenDevopsSpecialist', 'shell', 'docker compose up -d', 'deny');
          expectEffect('OpenDevopsSpecialist', 'shell', 'kubectl apply -f deploy.yaml', 'deny');
          expectEffect('OpenDevopsSpecialist', 'shell', 'terraform apply -auto-approve', 'deny');

          // Frontend specialist writes design artifacts only; production code and
          // shell remain owned by CoderAgent/parent gates.
          expectEffect('OpenFrontendSpecialist', 'edit', 'design_iterations/demo/page.html', 'allow');
          expectEffect('OpenFrontendSpecialist', 'edit', 'design_iterations/demo/theme.css', 'allow');
          expectEffect('OpenFrontendSpecialist', 'edit', 'src/App.tsx', 'deny');
          expectEffect('OpenFrontendSpecialist', 'shell', 'npm run build', 'deny');

          if (errors.length) throw new Error(`permission audit failed:\n- ${errors.join('\n- ')}`);
          NODE


      - name: Prove identical upgrade refreshes config and reuses binary
        env:
          OPENCODE_CONFIG_REF: ${{ github.sha }}
          OPENCODE_INSTALL_VERSION: 2.0.21
        run: |
          set -Eeuo pipefail
          cp "$HOME/.config/opencode/opencode.json" /tmp/opencode-config-before.json
          binary_before=$(sha256sum "$HOME/.opencode/bin/opencode")
          bash install.sh > /tmp/opencode-repeat.log 2>&1
          cat /tmp/opencode-repeat.log
          grep -Fq 'Скачиваю конфигурацию' /tmp/opencode-repeat.log
          grep -Fq 'Locked OpenCode plugin dependencies installed successfully.' /tmp/opencode-repeat.log
          grep -Fq 'Пропускаю обновление бинарника' /tmp/opencode-repeat.log
          cmp /tmp/opencode-config-before.json "$HOME/.config/opencode/opencode.json"
          test "$binary_before" = "$(sha256sum "$HOME/.opencode/bin/opencode")"
          test ! -d "$HOME/.config/opencode/node_modules/@opencode-ai/plugin"
          test -z "$(find "$HOME/.config" -maxdepth 1 -name '.opencode-stage.*' -print -quit)"
