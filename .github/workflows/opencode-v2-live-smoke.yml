name: OpenCode V2 live smoke

on:
  push:
    branches:
      - 'upgrade/opencode-v2'
    paths:
      - 'install.sh'
      - 'scripts/install-opencode-agents.sh'
      - 'config/opencode/**'
      - '.github/workflows/opencode-v2-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-v2-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OpenCode 2.0.21 with this branch config
        env:
          OPENCODE_CONFIG_REF: ${{ github.sha }}
          OPENCODE_INSTALL_VERSION: 2.0.21
        run: |
          set -Eeuo pipefail
          bash install.sh

      - name: Validate real V2 config, agents and permissions
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.opencode/bin:$HOME/.bun/bin:$PATH"
          version="$(opencode --version | sed -E 's/^opencode[[:space:]]+v?//; s/^v//')"
          test "$version" = "2.0.21"

          timeout 45s opencode debug config > /tmp/opencode-config.json 2> /tmp/opencode-config.err
          timeout 45s opencode debug agents > /tmp/opencode-agents.txt 2> /tmp/opencode-agents.err

          test -s /tmp/opencode-config.json
          test -s /tmp/opencode-agents.txt
          if grep -Fq 'Failed to load plugin' /tmp/opencode-config.err /tmp/opencode-agents.err; then
            cat /tmp/opencode-config.err /tmp/opencode-agents.err >&2
            exit 1
          fi
          test -f "$HOME/.config/opencode/plugins/pipeline-runtime.ts"
          test -f "$HOME/.config/opencode/AGENTS.md"
          grep -Fq '# Shell Non-Interactive Strategy (Global)' "$HOME/.config/opencode/AGENTS.md"
          test ! -e "$HOME/.config/opencode/context/shell-strategy"
          test ! -e "$HOME/.config/opencode/plugins/shell-strategy"
          ! grep -Fq '@franlol/opencode-md-table-formatter' "$HOME/.config/opencode/opencode.json"
          (
            cd "$HOME/.config/opencode"
            bun -e '
              const mod = await import("./plugins/pipeline-runtime.ts");
              if (!mod.default || typeof mod.default.id !== "string" || typeof mod.default.setup !== "function") {
                throw new Error("pipeline-runtime local plugin failed V2 import contract");
              }
            '
          )
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('/tmp/opencode-config.json', 'utf8');
          const config = JSON.parse(text);
          const agents = JSON.parse(fs.readFileSync('/tmp/opencode-agents.txt', 'utf8'));
          if (!Array.isArray(agents) || agents.length < 5) {
            throw new Error(`unexpected agent catalog: ${Array.isArray(agents) ? agents.length : 'not-array'}`);
          }

          const serialized = JSON.stringify(config);
          for (const forbidden of ['/tmp/openchamber-v2-install', '/home/guber/', '.opencode/skills/']) {
            if (serialized.includes(forbidden)) throw new Error(`stale/host-specific config path: ${forbidden}`);
          }
          for (const required of ['context7', 'gh_grep', '1c-buddy']) {
            if (!serialized.includes(required)) throw new Error(`missing configured MCP: ${required}`);
          }
          for (const retired of ['yonote', 'exchange', 'bitrix24', 'n8n', 'itop', 'google-drive', 'image-gen']) {
            if (serialized.includes(`"${retired}"`)) throw new Error(`retired MCP still active: ${retired}`);
          }

          const idOf = (agent) => agent.id ?? agent.name;
          const byID = new Map(agents.map((agent) => [idOf(agent), agent]));
          for (const required of ['OpenStageOrchestrator', 'CoderAgent', 'ContextScout', 'Architect', 'Reviewer', 'DocWriterAgent', 'QA']) {
            if (!byID.has(required)) throw new Error(`missing exact agent ID: ${required}`);
          }
          for (const required of ['CoderAgent', 'ContextScout', 'Architect', 'Reviewer', 'DocWriterAgent', 'QA']) {
            const mode = byID.get(required)?.mode;
            if (mode !== 'subagent' && mode !== 'all') {
              throw new Error(`${required} cannot be delegated to: mode=${mode}`);
            }
          }
          if (byID.get('OpenStageOrchestrator')?.mode === 'subagent') {
            throw new Error('OpenStageOrchestrator unexpectedly became subagent-only');
          }

          // OpenCode 2.0.21 derives IDs from the relative path below agents/.
          // Any slash here means the installer leaked source categories into IDs.
          const nested = [...byID.keys()].filter((id) => typeof id === 'string' && id.includes('/'));
          if (nested.length) throw new Error(`nested/non-canonical agent IDs: ${nested.join(', ')}`);

          const wildcard = (value, pattern) => {
            const escaped = pattern.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.');
            return new RegExp(`^${escaped}$`).test(value);
          };
          const evaluate = (rules, action, resource) => {
            for (let i = rules.length - 1; i >= 0; i--) {
              const rule = rules[i];
              if (wildcard(action, rule.action) && wildcard(resource, rule.resource)) return rule.effect;
            }
            return 'ask';
          };

          for (const agent of agents) {
            const id = idOf(agent);
            const rules = agent.permissions ?? [];
            for (const rule of rules) {
              if (rule.action !== 'subagent' || rule.effect !== 'allow') continue;
              if (rule.resource === '*' || /[*?]/.test(rule.resource)) continue;
              const target = byID.get(rule.resource);
              if (!target) throw new Error(`${id}: subagent allow targets unknown agent '${rule.resource}'`);
              if (target.mode !== 'subagent' && target.mode !== 'all') {
                throw new Error(`${id}: subagent allow targets non-subagent '${rule.resource}' mode=${target.mode}`);
              }
              const effective = evaluate(rules, 'subagent', rule.resource);
              if (effective !== 'allow') {
                throw new Error(`${id}: subagent allow for '${rule.resource}' is shadowed; effective=${effective}`);
              }
            }
          }

          // The pipeline orchestrator must retain its scoped write policy while
          // delegation is available. Do not widen edit merely to work around a
          // broken subagent catalog.
          const orchestrator = byID.get('OpenStageOrchestrator');
          const orchestratorRules = orchestrator.permissions ?? [];
          if (evaluate(orchestratorRules, 'edit', 'packages/example.ts') !== 'deny') {
            throw new Error('OpenStageOrchestrator broad edit unexpectedly allowed');
          }
          if (evaluate(orchestratorRules, 'edit', '.tmp/pipelines/example.md') !== 'allow') {
            throw new Error('OpenStageOrchestrator pipeline scratch edit not allowed');
          }
          for (const target of ['ContextScout', 'Architect', 'CoderAgent', 'Reviewer', 'DocWriterAgent', 'QA']) {
            if (evaluate(orchestratorRules, 'subagent', target) !== 'allow') {
              throw new Error(`OpenStageOrchestrator cannot delegate to ${target}`);
            }
          }
          if (evaluate(orchestratorRules, 'subagent', 'build') !== 'deny') {
            throw new Error('OpenStageOrchestrator unexpectedly allowed to delegate to primary build');
          }
          NODE
