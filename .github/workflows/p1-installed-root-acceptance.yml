name: P1 installed root acceptance

on:
  pull_request:
    paths:
      - 'install-openchamber.sh'
      - 'install.sh'
      - 'scripts/install-openchamber-root.sh'
      - 'scripts/install-openchamber-v2-core.sh'
      - 'scripts/openchamber-runtime-store.sh'
      - 'scripts/migrate-openchamber-to-root.py'
      - 'scripts/opencode-owner-approval*.py'
      - 'scripts/openchamber-child-boundary.cjs'
      - 'tests/test_openchamber_root_child_boundary.py'
      - 'tests/test_openchamber_shared_chats.py'
      - 'tests/test_root_openchamber_dac_boundary.py'
      - 'tests/p1-real-systemd-migration.sh'
      - 'scripts/rekey-openchamber-ui.py'
      - 'scripts/launch-openchamber-root.sh'
      - 'config/systemd/openchamber-root.service'
      - 'config/systemd/opencode-owner-approval.service'
      - '.github/workflows/p1-installed-root-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-installed-root-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boundary-and-chats-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Verify root-execution safety and Chats permissions
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/install-openchamber-root.sh
          node --check scripts/openchamber-child-boundary.cjs
          python3 tests/test_runtime_user_install_contract.py
          python3 tests/test_openchamber_shared_chats.py
          python3 tests/test_openchamber_root_child_boundary.py

  real-systemd-cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Verify immutable OpenChamber main release is published
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/gest0r1/openchamber-ru/pulls/29 --jq .merged)" = true || {
            echo 'P1_OPENCHAMBER_MAIN_REQUIRED: PR #29 must merge before installed root smoke'
            exit 1
          }
          sha="$(gh api repos/gest0r1/openchamber-ru/commits/main --jq .sha)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          gh release view "v2-web-package-$sha" --repo gest0r1/openchamber-ru >/dev/null || {
            echo "P1_RELEASE_REQUIRED: publish verified OpenChamber web package for $sha before installed acceptance"
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Provision safe root toolchain for ephemeral VM
        shell: bash
        run: |
          set -Eeuo pipefail
          # Actions installs Bun under runner HOME. Copy it to a root-owned
          # executable path before any privileged installer is invoked.
          sudo install -o root -g root -m 755 "$(command -v bun)" /usr/local/bin/bun
          # Hosted Ubuntu images frequently report "degraded" because an
          # unrelated preinstalled unit failed. PID 1 and systemd service
          # management, not a globally clean image, are the prerequisite.
          test -d /run/systemd/system
          sudo systemctl show --property=Version >/dev/null
      - name: Real systemd clean install and unchanged repeat upgrade
        id: install
        env:
          GH_TOKEN: ${{ github.token }}
          OC_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # DO NOT run on production. This is GitHub's disposable ubuntu VM.
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]] || {
            echo 'P1_EPHEMERAL_RUNNER_REQUIRED'; exit 2;
          }
          sudo -n env GH_TOKEN="$GH_TOKEN" PATH="/usr/local/bin:/usr/bin:/bin" \
            OPENCODE_CONFIG_REF="$GITHUB_SHA" OPENCHAMBER_REF="$OC_SHA" \
            bash scripts/install-openchamber-root.sh
          sudo systemctl is-active --quiet openchamber.service
          sudo systemctl is-active --quiet opencode-owner-approval.service
          sudo -u opencode env XDG_RUNTIME_DIR="/run/user/$(id -u opencode)" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u opencode)/bus" \
            systemctl --user is-active --quiet opencode-web.service
          test "$(sudo stat -c %a /run/my-opencode-approval/owner.sock)" = 600
          test "$(sudo stat -c %a /etc/my-opencode/owner-broker-required)" = 644
          test "$(sudo stat -c %a /etc/my-opencode/openchamber-execution.env)" = 600
          test "$(sudo stat -c %U /root/.config/openchamber/startup.env)" = root
          test "$(sudo stat -c %U /root/.config/openchamber/jwt-secret)" = root
          OPENCODE_TEST_PASSWORD="$(sudo -H -u opencode bash -c 'source "$HOME/.config/opencode.env"; printf %s "$OPENCODE_PASSWORD"')"
          [[ -n "$OPENCODE_TEST_PASSWORD" ]]
          expected="$(sudo -H -u opencode env HOME=/home/opencode XDG_CONFIG_HOME=/home/opencode/.config XDG_DATA_HOME=/home/opencode/.local/share XDG_STATE_HOME=/home/opencode/.local/state /home/opencode/.opencode/bin/opencode --version | sed -E 's/^opencode[[:space:]]+v?//')"
          running="$(curl -fsS -u "opencode:$OPENCODE_TEST_PASSWORD" http://127.0.0.1:4096/api/info |
            node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{const j=JSON.parse(s);const v=(j.data??j).version;if(typeof v!=="string")process.exit(1);console.log(v)})')"
          test "$expected" = "$running"
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          echo 'PASS: real systemd root service and unprivileged OpenCode'
          before_oc="$(sudo systemctl show openchamber.service --property=MainPID --value)"
          before_ocweb="$(sudo -u opencode env XDG_RUNTIME_DIR="/run/user/$(id -u opencode)" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u opencode)/bus" systemctl --user show opencode-web.service --property=MainPID --value)"
          id="$(curl -fsS -u "opencode:$OPENCODE_TEST_PASSWORD" -X POST http://127.0.0.1:4096/api/session -H 'Content-Type: application/json' -d '{"title":"P1 acceptance existing session"}' | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{const j=JSON.parse(s);if(!j.data?.id)process.exit(1);console.log(j.data.id)})')"
          [[ -n "$id" ]]
          sudo -n env GH_TOKEN="$GH_TOKEN" PATH="/usr/local/bin:/usr/bin:/bin" \
            OPENCODE_CONFIG_REF="$GITHUB_SHA" OPENCHAMBER_REF="$OC_SHA" \
            bash scripts/install-openchamber-root.sh
          after_oc="$(sudo systemctl show openchamber.service --property=MainPID --value)"
          after_ocweb="$(sudo -u opencode env XDG_RUNTIME_DIR="/run/user/$(id -u opencode)" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u opencode)/bus" systemctl --user show opencode-web.service --property=MainPID --value)"
          [[ "$before_oc" == "$after_oc" && "$before_ocweb" == "$after_ocweb" ]] || {
            echo 'P1_REINSTALL_RESTARTED_LIVE_SERVICE' >&2; exit 1;
          }
          curl -fsS -u "opencode:$OPENCODE_TEST_PASSWORD" "http://127.0.0.1:4096/api/session/$id" |
            node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{let j=JSON.parse(s);if(!j.data?.id)process.exit(1)})'
          echo "PASS: exact-SHA repeat install preserves OpenCode session and both process IDs"
          # Reproduce the VPS failure after the root UI has created a Chats tree.
          chats=/home/opencode/.config/openchamber/chats
          sudo install -d -o root -g opencode -m 2775 "$chats/2026-11-24" "$chats/2026-11-24/session-fixture"
          printf 'existing chat\n' | sudo -u opencode tee "$chats/2026-11-24/session-fixture/history.txt" >/dev/null
          # Force a configuration-only upgrade without changing the immutable app.
          printf '%s %s\n' "$(printf '%040d' 0)" "$OC_SHA" | sudo tee /var/lib/my-opencode/openchamber-root-installer/active-sha >/dev/null
          sudo -n env GH_TOKEN="$GH_TOKEN" PATH="/usr/local/bin:/usr/bin:/bin" \
            OPENCODE_CONFIG_REF="$GITHUB_SHA" OPENCHAMBER_REF="$OC_SHA" \
            OPENCHAMBER_RESTART_MODE=now bash scripts/install-openchamber-root.sh
          sudo systemctl is-active --quiet openchamber.service
          test "$(sudo stat -c %U:%G:%a "$chats/2026-11-24/session-fixture")" = root:opencode:2775
          test "$(sudo cat "$chats/2026-11-24/session-fixture/history.txt")" = 'existing chat'
          latest_ocweb="$(sudo -u opencode env XDG_RUNTIME_DIR="/run/user/$(id -u opencode)" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u opencode)/bus" systemctl --user show opencode-web.service --property=MainPID --value)"
          test "$latest_ocweb" = "$after_ocweb"
          echo 'PASS: single-invocation root-to-root upgrade preserves shared Chats and idle OpenCode'

      - name: Verify root UI traversal and unprivileged child capability boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/test_root_openchamber_dac_boundary.py
      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          sudo systemctl status openchamber.service --no-pager -l || true
          sudo systemctl status opencode-owner-approval.service --no-pager -l || true
          sudo journalctl -u openchamber.service -n 90 --no-pager || true
          sudo journalctl -u opencode-owner-approval.service -n 90 --no-pager || true

  real-systemd-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Verify exact published root-safe OpenChamber release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/gest0r1/openchamber-ru/pulls/29 --jq .merged)" = true
          sha="$(gh api repos/gest0r1/openchamber-ru/commits/main --jq .sha)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          gh release view "v2-web-package-$sha" --repo gest0r1/openchamber-ru >/dev/null
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Prepare disposable real-systemd runner
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          test -d /run/systemd/system
          sudo install -o root -g root -m 755 "$(command -v bun)" /usr/local/bin/bun
      - name: Migrate legacy user UI and prove full rollback and retry
        env:
          GH_TOKEN: ${{ github.token }}
          OC_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: bash tests/p1-real-systemd-migration.sh
      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          sudo systemctl status openchamber.service --no-pager -l || true
          sudo systemctl status opencode-owner-approval.service --no-pager -l || true
          sudo journalctl -u openchamber.service -n 90 --no-pager || true
          sudo journalctl -u opencode-owner-approval.service -n 90 --no-pager || true
