name: Pipeline live GitHub gate smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches:
      - main
    paths:
      - 'config/opencode/skills/task-management/scripts/github-actions-gate-*.mjs'
      - 'config/opencode/skills/task-management/scripts/github-actions-gate-*.ts'
      - 'config/opencode/skills/task-management/scripts/github-workflow-yaml.mjs'
      - '.github/workflows/pipeline-gate-live-fixture.yml'
      - '.github/workflows/pipeline-gate-live-failure-fixture.yml'
      - '.github/workflows/pipeline-live-smoke.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: pipeline-live-github-gate-smoke
  cancel-in-progress: false

jobs:
  live_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_RUN_ID: live-github-gate
      TARGET_REPOSITORY: ${{ github.repository }}
      TARGET_BRANCH: ${{ github.ref_name }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Prepare frozen live-gate fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/live-gate"
          STATE_ROOT="$RUNNER_TEMP/live-gate-state"
          RUN_ROOT="$ROOT/$LIVE_RUN_ID"
          mkdir -p "$RUN_ROOT" "$STATE_ROOT/$LIVE_RUN_ID"
          node - "$RUN_ROOT" "$STATE_ROOT" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const [runRoot, stateRoot] = process.argv.slice(2);
          const runId = process.env.LIVE_RUN_ID;
          const manifestFile = path.join(runRoot, 'manifest.json');
          const manifest = {
            schema_version: 2,
            run_id: runId,
            repository: process.env.TARGET_REPOSITORY,
            git_setup: { base_sha: process.env.TARGET_SHA, branch: process.env.TARGET_BRANCH },
            pipelines: [{
              id: 'app',
              stages: ['tests', 'negative'],
              executors: { tests: 'github_ci', negative: 'github_ci' },
              github_gates: {
                tests: {
                  workflow: '.github/workflows/pipeline-gate-live-fixture.yml',
                  terminal_job: 'pipeline_ci',
                  trigger: 'workflow_dispatch',
                  timeout_seconds: 480
                },
                negative: {
                  workflow: '.github/workflows/pipeline-gate-live-failure-fixture.yml',
                  terminal_job: 'pipeline_ci',
                  trigger: 'workflow_dispatch',
                  timeout_seconds: 480
                }
              }
            }]
          };
          fs.writeFileSync(manifestFile, JSON.stringify(manifest, null, 2) + '\n');
          fs.writeFileSync(path.join(runRoot, 'candidate.json'), JSON.stringify({
            status: 'PASS',
            run_id: runId,
            branch: process.env.TARGET_BRANCH,
            candidate_sha: process.env.TARGET_SHA,
            remote_sha: process.env.TARGET_SHA
          }, null, 2) + '\n');
          fs.writeFileSync(path.join(stateRoot, runId, 'state.json'), JSON.stringify({
            run_id: runId,
            manifest_file: manifestFile
          }, null, 2) + '\n');
          NODE
          echo "LIVE_RUN_ROOT=$RUN_ROOT" >> "$GITHUB_ENV"
          echo "LIVE_STATE_ROOT=$STATE_ROOT" >> "$GITHUB_ENV"

      - name: Validate trusted fixture workflow
        run: >
          npx --yes tsx
          config/opencode/skills/task-management/scripts/github-actions-gate-cli.ts
          validate "$LIVE_RUN_ID" app tests --state-root "$LIVE_STATE_ROOT"

      - name: Dispatch and verify exact new GitHub run
        run: >
          npx --yes tsx
          config/opencode/skills/task-management/scripts/github-actions-gate-cli.ts
          run "$LIVE_RUN_ID" app tests --state-root "$LIVE_STATE_ROOT"

      - name: Assert live evidence identity
        shell: bash
        run: |
          set -Eeuo pipefail
          node - "$LIVE_RUN_ROOT/github/app-tests.json" <<'NODE'
          const fs = require('fs');
          const evidence = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (evidence.status !== 'PASS') throw new Error('live gate is not PASS');
          if (evidence.candidate_sha !== process.env.TARGET_SHA) throw new Error('candidate SHA mismatch');
          if (evidence.head_sha !== process.env.TARGET_SHA) throw new Error('run head SHA mismatch');
          if (evidence.workflow !== '.github/workflows/pipeline-gate-live-fixture.yml') throw new Error('workflow mismatch');
          if (!Number.isInteger(Number(evidence.workflow_run_id))) throw new Error('run id missing');
          NODE


      - name: Validate intentional failure fixture
        run: >
          npx --yes tsx
          config/opencode/skills/task-management/scripts/github-actions-gate-cli.ts
          validate "$LIVE_RUN_ID" app negative --state-root "$LIVE_STATE_ROOT"

      - name: Dispatch intentional failure and require canonical FAIL evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          if npx --yes tsx             config/opencode/skills/task-management/scripts/github-actions-gate-cli.ts             run "$LIVE_RUN_ID" app negative --state-root "$LIVE_STATE_ROOT"
          then
            echo "negative live fixture unexpectedly passed" >&2
            exit 1
          fi
          test -f "$LIVE_RUN_ROOT/github/app-negative.json"
          npx --yes tsx             config/opencode/skills/task-management/scripts/github-actions-gate-cli.ts             diagnose "$LIVE_RUN_ID" app negative --state-root "$LIVE_STATE_ROOT"             > "$RUNNER_TEMP/negative-diagnostics-output.json"

      - name: Assert live failure diagnostics and redaction
        shell: bash
        run: |
          set -Eeuo pipefail
          node -             "$LIVE_RUN_ROOT/github/app-negative.json"             "$LIVE_RUN_ROOT/github/app-negative-diagnostics.json" <<'NODE'
          const fs = require('fs');
          const [evidenceFile, diagnosticsFile] = process.argv.slice(2);
          const evidence = JSON.parse(fs.readFileSync(evidenceFile, 'utf8'));
          const diagnostics = JSON.parse(fs.readFileSync(diagnosticsFile, 'utf8'));
          if (evidence.status !== 'FAIL') throw new Error('negative gate evidence is not FAIL');
          if (evidence.candidate_sha !== process.env.TARGET_SHA) throw new Error('negative candidate SHA mismatch');
          if (evidence.workflow !== '.github/workflows/pipeline-gate-live-failure-fixture.yml') throw new Error('negative workflow mismatch');
          if (!Number.isInteger(Number(evidence.workflow_run_id))) throw new Error('negative run id missing');
          const jobs = Array.isArray(diagnostics.jobs) ? diagnostics.jobs : [];
          const failed = jobs.flatMap((job) => job.failed_steps || []);
          if (!failed.some((step) => step.name === 'Intentional fixture failure')) {
            throw new Error('failed fixture step missing from diagnostics');
          }
          const log = String(diagnostics.failed_log_excerpt || '');
          if (!log.includes('intentional live negative fixture failure')) throw new Error('failed log excerpt missing');
          if (log.includes('fixture-secret-value')) throw new Error('secret-like fixture value was not redacted');
          if (!/TOKEN=\[REDACTED\]/i.test(log)) throw new Error('redaction marker missing');
          NODE
