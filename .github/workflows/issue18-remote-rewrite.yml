name: Issue 18 guarded Git history rewrite preparation
on:
  push:
    branches:
      - security/issue18-history-cleanup-phase2
    paths:
      - scripts/issue18-remote-rewrite.py
      - .github/workflows/issue18-remote-rewrite.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: issue18-remote-rewrite
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE18_REWRITE_APPLY: yes
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
      - name: Install local rewrite dependency
        run: python3 -m pip install --user --break-system-packages 'git-filter-repo>=2.47.0'
      - name: Validate clean mirror without pushing anything
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 scripts/issue18-remote-rewrite.py prepare "$RUNNER_TEMP/issue18-cleanup"
      - name: Install age encryption for private backup
        run: sudo apt-get update -qq && sudo apt-get install -qq -y age
      - name: Encrypt pre-rewrite mirror to owner's registered SSH public keys
        run: |
          set -Eeuo pipefail
          keys="$RUNNER_TEMP/issue18-cleanup/owner-recipients.keys"
          curl -fsSL --max-time 30 https://github.com/gest0r1.keys > "$keys"
          grep -Eq '^ssh-(ed25519|rsa) ' "$keys" || { echo "No supported GitHub SSH recipient; refusing rewrite" >&2; exit 1; }
          tar -cf - -C "$RUNNER_TEMP/issue18-cleanup" original.git | age -R "$keys" -o "$RUNNER_TEMP/issue18-cleanup/private-original.bundle.tar.age"
          test -s "$RUNNER_TEMP/issue18-cleanup/private-original.bundle.tar.age"
          rm -f -- "$keys"
          echo "ISSUE18_BACKUP encrypted=yes; decryption requires the GitHub owner's SSH private key"
      - name: Preserve encrypted backup for emergency recovery
        uses: actions/upload-artifact@v4
        with:
          name: issue18-encrypted-history-before-rewrite
          path: ${{ runner.temp }}/issue18-cleanup/private-original.bundle.tar.age
          retention-days: 7
          if-no-files-found: error
      - name: Apply one atomic remote lease update only after backup exists
        if: env.ISSUE18_REWRITE_APPLY == 'yes'
        env:
          ISSUE18_ENCRYPTED_BACKUP_VERIFIED: yes
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 scripts/issue18-remote-rewrite.py apply "$RUNNER_TEMP/issue18-cleanup"
      - name: Remove private plaintext scratch from runner
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/issue18-cleanup"
